name: Java Selenium TestNG - Xray

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      testExecKey:
        description: 'Test Exec ID from Xray'
        default: ''
        required: true
        type: string

      projectKey:
        description: 'Project ID from Xray'
        default: ''
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout projects
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Check Java and Mavenn
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version


      # 4. Run Selenium + TestNG
      - name: Run TestNG tests
        continue-on-error: true
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/xml/testng.xml


      # 5. Display TestNG results
      - name: Display TestNG results
        if: always()
        run: |
          echo "===== TestNG reports ====="
          find target/surefire-reports -type f -maxdepth 2 || true


      # 6. Import TestNG results into Xray
      - name: Import results to Xray
        if: always()
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}

          testFormat: "testng"

          testPaths: "**/target/surefire-reports/testng-results.xml"

          testExecKey: "${{ inputs.testExecKey }}"
          projectKey: "${{ inputs.projectKey }}"


      # 7. Save TestNG reports
      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: target/surefire-reports/
