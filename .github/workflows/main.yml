name: Java Selenium TestNG - Xray

on:
  workflow_dispatch:
    inputs:
      testExecKey:
        description: 'Test Execution key from Xray'
        required: true
        type: string

      projectKey:
        description: 'Jira/Xray project key'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout projects
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Check Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version


      # 4. Run Selenium+TestNG
      - name: Run TestNG tests
        continue-on-error: true
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/xml/testng.xml


      # 5. Display TestNG results
      - name: Display TestNG results
        if: always()
        run: |
          echo "===== TestNG reports ====="
          find target/surefire-reports -type f -maxdepth 2 -print || true


      # 6. Check Xray secrets
      - name: Check Xray secrets
        if: always()
        run: |
          if [ -z "${{ secrets.XRAY_CLIENT_ID }}" ]; then
            echo "ERROR: XRAY_CLIENT_ID is missing"
            exit 1
          else
            echo "OK: XRAY_CLIENT_ID is available"
          fi

          if [ -z "${{ secrets.XRAY_CLIENT_SECRET }}" ]; then
            echo "ERROR: XRAY_CLIENT_SECRET is missing"
            exit 1
          else
            echo "OK: XRAY_CLIENT_SECRET is available"
          fi


      # 7. Import TestNG results into Xray
      - name: Import results to Xray
        if: always()
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}

          testFormat: "testng"

          testPaths: "**/target/surefire-reports/testng-results.xml"

          testExecKey: ${{ inputs.testExecKey }}
          projectKey: ${{ inputs.projectKey }}


      # 8. Save TestNG reports
      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: target/surefire-reports/
