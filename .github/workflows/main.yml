name: Java Selenium TestNG + Cucumber - Xray

on:
  workflow_dispatch:
    inputs:
      testExecKey:
        description: 'Test Execution key from Xray'
        required: true
        type: string

      projectKey:
        description: 'Jira/Xray project key'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Run All Tests (TestNG + Cucumber)
      - name: Run Tests
        continue-on-error: true
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/xml/testng.xml

      # 4. Check Xray secrets
      - name: Check Xray secrets
        if: always()
        run: |
          if [ -z "${{ secrets.XRAY_CLIENT_ID }}" ]; then
            echo "ERROR: XRAY_CLIENT_ID is missing"
            exit 1
          fi
          if [ -z "${{ secrets.XRAY_CLIENT_SECRET }}" ]; then
            echo "ERROR: XRAY_CLIENT_SECRET is missing"
            exit 1
          fi

      # 5. Import ONLY Classic TestNG Results to Xray
      - name: Import TestNG results to Xray
        if: always()
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: "testng"
          testPaths: "**/target/surefire-reports/testng-results.xml"
          testExecKey: ${{ inputs.testExecKey }}
          projectKey: ${{ inputs.projectKey }}

      # 6. Import Cucumber BDD Results to Xray (Lié via @XQDP-76)
      - name: Import Cucumber results to Xray
        if: always()
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: "cucumber"
          testPaths: "**/target/cucumber-report.json"
          testExecKey: ${{ inputs.testExecKey }}
          projectKey: ${{ inputs.projectKey }}

      # 7. Upload Artifacts
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: |
            target/surefire-reports/
            target/cucumber-report.json
            target/cucumber-report.html
