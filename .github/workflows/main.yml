name: Java Selenium TestNG + Cucumber - Xray

on:
  workflow_dispatch:
    inputs:
      testExecKey:
        description: 'Test Execution key from Xray (e.g., XQDP-69)'
        required: true
        default: 'XQDP-69'
        type: string

      projectKey:
        description: 'Jira/Xray project key'
        required: true
        default: 'XQDP'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Execute Tests
      - name: Run Tests
        continue-on-error: true
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/xml/testng.xml

      # 4. Authenticate & Import directly to XQDP-69
      - name: Import Cucumber Results to Target Test Execution
        if: always()
        run: |
          # Retrieve Xray Bearer Token
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST --data "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate | tr -d '"')

          # POST Cucumber JSON directly targeting testExecKey
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @target/cucumber-report.json \
            "https://xray.cloud.getxray.app/api/v2/import/execution/cucumber?testExecKey=${{ inputs.testExecKey }}"

      # 5. Save Artifacts
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            target/surefire-reports/
            target/cucumber-report.json
